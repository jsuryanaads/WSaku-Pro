name: Fix Master Data Delete
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix workspace delete filter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = 'const remove=async id=>{if(!confirm("Hapus data ini?"))return;const{error}=await supabase.from(cfg.table).delete().eq("id",id).eq("workspace_id",id);'
          new = 'const remove=async rowId=>{if(!confirm("Hapus data ini?"))return;const{error}=await supabase.from(cfg.table).delete().eq("id",rowId).eq("workspace_id",id);'
          if old not in s:
              print('Target already fixed or source changed; no update needed.')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'fix: correct workspace filter for master data delete'
          git push
