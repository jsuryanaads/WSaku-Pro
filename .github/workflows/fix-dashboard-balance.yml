name: Fix Dashboard Balance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  fix-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix dashboard data source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text()
          old='supabase.from("cash_accounts").select("id,name,type,opening_balance,is_active").eq("workspace_id",id).eq("is_active",true).order("created_at")'
          new='supabase.from("cash_account_balances").select("id,name,type,opening_balance,is_active,balance").eq("workspace_id",id).eq("is_active",true).order("name")'
          s=s.replace(old,new,1)
          old2='const balance=accounts.reduce((s,a)=>s+Number(a.opening_balance||0),0)+stats.income-stats.expense;'
          new2='const balance=accounts.reduce((s,a)=>s+Number(a.balance||0),0);'
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm install
          npm run build
      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo 'No source changes needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/App.jsx
            git commit -m 'fix: use calculated cash account balances'
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
